<!doctype html>
<html><head><meta charset="utf-8"><title>WS Diagnose</title>
<style>
  body { background:#111; color:#eee; font-family: monospace; padding: 12px; }
  .ok { color: #6f6; } .bad { color: #f66; } .info { color: #ff6; }
  pre { background: #000; padding: 8px; max-height: 300px; overflow: auto; }
</style></head>
<body>
<h2>WebSocket-Diagnose</h2>
<div id="status">Initialisiere...</div>
<pre id="log"></pre>
<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');
  function add(s, cls) {
    const t = new Date().toISOString().substr(11, 12);
    log.textContent += `[${t}] ${s}\n`;
    if (cls) status.innerHTML = `<span class="${cls}">${s}</span>`;
  }
  const URL = "ws://127.0.0.1:7891";
  add(`URL: ${URL}`, 'info');
  add(`location: ${location.href}`);
  add(`origin: ${location.origin}`);
  try {
    const ws = new WebSocket(URL);
    ws.onopen  = () => add("✓ open — Verbindung steht", 'ok');
    ws.onerror = (e) => add(`✗ error — vermutlich blockiert oder Backend nicht erreichbar`, 'bad');
    ws.onclose = (e) => add(`✗ close — code=${e.code} reason="${e.reason||''}" clean=${e.wasClean}`, 'bad');
    let n = 0;
    ws.onmessage = (m) => {
      n++;
      if (n <= 3) {
        const d = JSON.parse(m.data);
        add(`✓ frame #${n}  ts=${d.ts}  bb3a.v=${d.devices.bb3a.voltage}V`, 'ok');
      } else if (n === 4) {
        add(`✓ mehr Frames kommen... (${n}+)`, 'ok');
      }
    };
  } catch (e) {
    add(`✗ Exception: ${e.message}`, 'bad');
  }
</script>
</body></html>
